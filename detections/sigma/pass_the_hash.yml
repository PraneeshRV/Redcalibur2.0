title: Pass-the-Hash Network Logon
id: 38b953f6-a111-4e00-ab61-efd8aa788779
status: experimental
description: |
  Detects the logon signature left by pass-the-hash / overpass-the-hash tools
  (for example Mimikatz sekurlsa::pth). A successful logon (Event 4624) with
  LogonType 9 (NewCredentials), the seclogo logon process and the Negotiate
  authentication package indicates credentials were injected into a new logon
  session rather than typed by a user. This pattern is rare in normal use and a
  strong indicator of credential reuse for lateral movement.
references:
  - https://attack.mitre.org/techniques/T1550/002/
author: RedCalibur
date: 2026-10-07
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 9
    LogonProcessName: seclogo
    AuthenticationPackageName: Negotiate
  condition: selection
falsepositives:
  - runas /netonly used by administrators or deployment tooling
level: high
tags:
  - attack.lateral_movement
  - attack.t1550.002
