title: Suspicious LSASS Process Access (Credential Dumping)
id: 6e820bce-dc0b-4b53-a041-0f8708c2eea8
status: experimental
description: |
  Detects a process opening a handle to lsass.exe with access rights that allow
  reading process memory (Sysmon Event 10). Credential dumping tools such as
  Mimikatz (sekurlsa::logonpasswords) request access masks like 0x1010 / 0x1410
  to extract plaintext credentials and hashes from LSASS. Known-good readers
  (antimalware, the OS process bootstrap) are filtered out.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: RedCalibur
date: 2026-10-07
logsource:
  product: windows
  category: process_access
detection:
  selection:
    EventID: 10
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
  filter_known:
    SourceImage|endswith:
      - '\MsMpEng.exe'
      - '\wininit.exe'
      - '\wmiprvse.exe'
  condition: selection and not filter_known
falsepositives:
  - Endpoint protection and backup agents reading LSASS
  - Legitimate debugging or crash-dump tooling
level: high
tags:
  - attack.credential_access
  - attack.t1003.001
